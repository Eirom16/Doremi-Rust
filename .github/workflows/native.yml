name: Native module (Rust)

on:
  push:
    branches: [main]
    paths:
      - "src/doremi/native_rs/**"
      - "tests/test_native_rs.py"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "src/doremi/native_rs/**"
      - "tests/test_native_rs.py"
      - ".github/workflows/native.yml"

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-and-test:
    name: Build native_rs + parity tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/doremi/native_rs

      - name: Build native module wheel
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          cd src/doremi/native_rs
          maturin build --release --out dist

      - name: Install module + test deps
        run: |
          pip install src/doremi/native_rs/dist/doremi_native_rs-*.whl
          pip install pytest PySide6

      - name: Run parity tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_native_rs.py -v
