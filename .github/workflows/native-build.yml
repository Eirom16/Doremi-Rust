name: Native wheels (Rust)

# F0B-1: reproducible release-mode builds of the native module for
# Linux x86_64 and Windows x64. Produces intermediate wheel artifacts only —
# no installers, no AppImages, no GitHub Releases.

on:
  push:
    branches: [build/f0b1-native-foundation]
    paths:
      - "src/doremi/native_rs/**"
      - "tests/test_native_rs.py"
      - ".github/workflows/native-build.yml"
  pull_request:
    paths:
      - "src/doremi/native_rs/**"
      - "tests/test_native_rs.py"
      - ".github/workflows/native-build.yml"
  workflow_dispatch:

jobs:
  build-wheel:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/doremi/native_rs

      # PySide6.QtGui links against libEGL/libGL at import time; the ubuntu
      # image does not ship them (same root cause as native.yml in F0A).
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3

      - name: Build release wheel (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          cd src/doremi/native_rs
          maturin build --release --locked --out dist

      - name: Build release wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          Set-Location src/doremi/native_rs
          maturin build --release --locked --out dist

      - name: Install wheel + test deps (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pip install src/doremi/native_rs/dist/doremi_native_rs-*.whl
          pip install pytest PySide6

      - name: Install wheel + test deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = Get-ChildItem src/doremi/native_rs/dist/*.whl | Select-Object -First 1 -ExpandProperty FullName
          if (-not $wheel) { throw "no wheel found in src/doremi/native_rs/dist" }
          pip install $wheel
          pip install pytest PySide6

      # Smoke test outside the source tree and without PYTHONPATH, so a stale
      # in-tree build can never shadow the installed wheel.
      - name: Smoke test installed wheel (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd "$RUNNER_TEMP"
          python -c "import sys; print(sys.version)"
          python -c "import native_rs, sys; print(native_rs.__file__); assert 'site-packages' in native_rs.__file__.replace(chr(92), '/'), native_rs.__file__"
          python -c "import native_rs, pathlib; pkg = pathlib.Path(native_rs.__file__).parent; exts = list(pkg.glob('native_rs*.so')); assert exts, sorted(p.name for p in pkg.iterdir()); print('platform binary OK:', exts[0].name)"
          python -c "import native_rs; fns = ['process_qss_template', 'compute_color_variants', 'adjust_hsv', 'extract_n_colors', 'average_center_zone', 'update_blobs']; missing = [f for f in fns if not callable(getattr(native_rs, f, None))]; assert not missing, missing; assert hasattr(native_rs, 'ColorVariants'); print('API OK:', sorted(n for n in dir(native_rs) if not n.startswith('_')))"

      - name: Smoke test installed wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          python -c "import sys; print(sys.version)"
          python -c "import native_rs; print(native_rs.__file__)"
          python -c "import native_rs; assert 'site-packages' in native_rs.__file__.replace(chr(92), '/'), native_rs.__file__; print('installed location OK')"
          python -c "import native_rs, pathlib; pkg = pathlib.Path(native_rs.__file__).parent; exts = list(pkg.glob('native_rs*.pyd')); assert exts, sorted(p.name for p in pkg.iterdir()); print('platform binary OK:', exts[0].name)"
          python -c "import native_rs; fns = ['process_qss_template', 'compute_color_variants', 'adjust_hsv', 'extract_n_colors', 'average_center_zone', 'update_blobs']; missing = [f for f in fns if not callable(getattr(native_rs, f, None))]; assert not missing, missing; assert hasattr(native_rs, 'ColorVariants'); print('API OK:', sorted(n for n in dir(native_rs) if not n.startswith('_')))"

      # Full parity suite against the installed wheel (PYTHONPATH=src only
      # exposes the `doremi` bridge package; `native_rs` itself must still
      # resolve to site-packages — asserted again below).
      - name: Run native parity tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          python -c "import native_rs; assert 'site-packages' in native_rs.__file__.replace(chr(92), '/'), native_rs.__file__; print('under test:', native_rs.__file__)"
          python -m pytest tests/test_native_rs.py -v

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: doremi-native-rs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: src/doremi/native_rs/dist/*.whl
          retention-days: 7
